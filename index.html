<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Система контенту 2026</title>
    
    <!-- Шрифти: Cormorant + Montserrat (Стиль Visual Expert) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #FDFBF8;
            --text-main: #1C1C1C;
            --text-gray: #666666;
            --border-color: #E0E0E0;
            --font-title: 'Cormorant Garamond', serif; 
            --font-body: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px; 
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
        }

        /* --- 1. ЗАГОЛОВОК (Замість імені) --- */
        .main-title {
            font-family: var(--font-title);
            font-size: 28px;
            font-weight: 500;
            text-align: center;
            text-transform: uppercase;
            line-height: 1.2;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        /* --- 2. ВІДЕО + Оверлей "Натисніть" --- */
        .video-container {
            position: relative;
            margin-bottom: 25px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
            z-index: 10; /* Відео зверху */
        }

        /* Підказка "Натисніть для перегляду" - зникне після кліку на ютубі */
        .video-hint {
            text-align: center;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-gray);
            margin-top: 8px;
        }

        /* --- 3. ТЕКСТ ПІД ВІДЕО --- */
        .bonus-text {
            text-align: center;
            font-family: var(--font-title);
            font-size: 20px;
            font-style: italic;
            font-weight: 500;
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        /* --- 4. КНОПКА --- */
        .btn-link {
            display: block;
            width: 100%;
            padding: 18px;
            text-align: center;
            border: 1px solid var(--text-main);
            background: transparent;
            color: var(--text-main);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s;
            margin-bottom: 50px;
            cursor: pointer;
        }
        .btn-link:hover { background: var(--text-main); color: #fff; }

        /* --- 5. АНКЕТА --- */
        .form-section {
            border-top: 1px solid var(--border-color);
            padding-top: 40px;
        }
        .form-title {
            font-family: var(--font-title);
            font-size: 24px;
            text-align: center;
            margin-bottom: 10px;
        }
        .form-desc {
            text-align: center;
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 30px;
        }
        .input-group { margin-bottom: 25px; }
        label {
            display: block; font-size: 10px; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 8px; color: var(--text-gray);
        }
        input {
            width: 100%; padding: 12px 0; background: transparent; border: none;
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-body); font-size: 16px; color: var(--text-main);
            border-radius: 0; -webkit-appearance: none; outline: none;
        }
        input:focus { border-bottom-color: var(--text-main); }
        .btn-submit {
            width: 100%; padding: 20px; background-color: var(--text-main);
            color: #fff; border: none; font-family: var(--font-body);
            font-size: 13px; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; margin-top: 15px;
        }
        footer { margin-top: 60px; font-size: 10px; text-align: center; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. НОВИЙ ЗАГОЛОВОК -->
        <h1 class="main-title">
            Як у 2026 році<br>
            побудувати систему<br>
            роботи з контентом та візуалом
        </h1>

        <!-- 2. ВІДЕО + НАПИС -->
        <div class="video-container">
            <div class="video-wrapper">
                <!-- Встав сюди своє посилання на YouTube -->
                <iframe 
                    src="https://www.youtube.com/embed/dQw4w9WgXcQ?controls=1&modestbranding=1&rel=0" 
                    title="YouTube video" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <!-- Підказка під відео -->
            <div class="video-hint">Натисніть для перегляду</div>
        </div>

        <!-- 3. ТЕКСТ ПРО БОНУСИ -->
        <div class="bonus-text">
            Забирай 2 бонуси<br>після перегляду уроку
        </div>

        <!-- 4. КНОПКА (Scroll to form) -->
        <a href="#anketa" class="btn-link">
            ЗАПОВНИТИ АНКЕТУ
        </a>

        <!-- 5. АНКЕТА -->
        <div class="form-section" id="anketa">
            <div class="form-title">АНКЕТА ПРЕДЗАПИСУ</div>
            <div class="form-desc">Заповніть форму, щоб отримати бонуси та доступ</div>
            
            <form action="#" method="POST">
                <div class="input-group">
                    <label>Ваше Ім'я</label>
                    <input type="text" name="name" placeholder="Введіть ім'я" required>
                </div>
                <div class="input-group">
                    <label>Instagram</label>
                    <input type="text" name="instagram" placeholder="@username" required>
                </div>
                <div class="input-group">
                    <label>Telegram</label>
                    <input type="text" name="telegram" placeholder="@username" required>
                </div>
                <div class="input-group">
                    <label>Телефон</label>
                    <input type="tel" name="phone" placeholder="+380..." required>
                </div>
                <button type="submit" class="btn-submit">НАДІСЛАТИ</button>
            </form>
        </div>

        <footer>© 2024 System Content</footer>

    </div>

</body>
</html>
