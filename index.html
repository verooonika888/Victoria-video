    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* БАЗОВІ НАЛАШТУВАННЯ */
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #050505; /* Чорний фон */
            color: #ffffff; /* Білий текст */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Unbounded', sans-serif;
        }

        /* Виправлена видимість елементів */
        .fade-in-up {
            /* Прибрали opacity: 0, щоб контент було видно завжди */
            animation: fadeInUp 1s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden-element { display: none !important; }

        /* Стилі для відео */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: #111;
            border: 1px solid rgba(255,255,255,0.1);
            aspect-ratio: 16/9;
            cursor: pointer;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 10;
            pointer-events: none; /* Клік проходить крізь кнопку */
        }

        /* Стилі полів вводу */
        .custom-input {
            background-color: #111;
            border: 1px solid #333;
            color: white;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            font-family: 'Manrope', sans-serif;
            box-sizing: border-box; /* Важливо для відступів */
        }
        
        /* Адаптація телефону */
        .iti { width: 100%; display: block; }
        .iti__tel-input {
            background-color: #111 !important;
            border: 1px solid #333 !important;
            color: white !important;
            border-radius: 12px !important;
            width: 100% !important;
        }
        .iti__country-list {
            background-color: #222 !important;
            color: white !important;
            border: 1px solid #444 !important;
        }

        /* Картка (скло) */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        /* Акцент */
        .text-brand { color: #E13030; }
        .bg-brand { background-color: #E13030; }
    </style>
</head>
